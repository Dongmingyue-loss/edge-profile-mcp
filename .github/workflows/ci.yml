name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The test suite drives the real Microsoft Edge, which ships with the
    # windows-latest runner image.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps msedge

      - name: Verify Edge is available
        shell: pwsh
        run: |
          $edge = Get-Command msedge -ErrorAction SilentlyContinue
          if (-not $edge) {
            $path = "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe"
            if (-not (Test-Path $path)) { throw "Microsoft Edge not found on runner" }
          }

      - name: Import check
        run: python -c "import edge_profile_mcp; print(edge_profile_mcp.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
        env:
          # Keep browser sessions out of the runner's real Edge profile.
          EDGE_AUTOMATION_PROFILE_DIR: ${{ runner.temp }}\ci-edge-profile

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
