name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite drives a real browser. windows-latest has no Edge and Playwright
    # cannot install one (playwright install knows chromium/firefox/webkit and
    # the system "chrome" channel only), so CI installs bundled Chromium and
    # clears EDGE_AUTOMATION_BROWSER_CHANNEL to use it. Everything else — the
    # private profile, the isolation checks, the extraction and search logic —
    # runs unchanged. Real-Edge behaviour is verified locally on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install the test browser
        run: python -m playwright install chromium

      - name: Import check
        run: python -c "import edge_profile_mcp; print(edge_profile_mcp.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
        env:
          # Use bundled Chromium: no Edge is available on the runner.
          EDGE_AUTOMATION_BROWSER_CHANNEL: ""
          # Keep browser sessions out of the runner's real browser profile.
          EDGE_AUTOMATION_PROFILE_DIR: ${{ runner.temp }}\ci-edge-profile

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
