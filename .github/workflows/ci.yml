name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The test suite drives the real Microsoft Edge. windows-latest does not ship
    # a usable Edge for automation, so it is installed explicitly below rather
    # than relying on the image.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Microsoft Edge
        shell: pwsh
        run: |
          # Playwright's installer puts Edge where channel="msedge" looks for it.
          python -m playwright install msedge

      - name: Report Edge location
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Edge executable not found in the usual locations."
            Get-ChildItem -Path "$env:LOCALAPPDATA\ms-playwright" -Filter msedge.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 3 -ExpandProperty FullName
            throw "Microsoft Edge not available; the browser tests cannot run."
          }
          Write-Host "Using Edge at $found"

      - name: Import check
        run: python -c "import edge_profile_mcp; print(edge_profile_mcp.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
        env:
          # Keep browser sessions out of the runner's real Edge profile.
          EDGE_AUTOMATION_PROFILE_DIR: ${{ runner.temp }}\ci-edge-profile

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
